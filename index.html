<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantagenvers</title>
    <!-- Tailwind per il design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse per i CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Font e icone -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        fantaBg: '#0b0f19', 
                        fantaCard: 'rgba(30, 41, 59, 0.7)',
                        fantaBorder: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; background-image: radial-gradient(circle at top, #1f0510 0%, #0b0f19 50%); background-attachment: fixed; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stile bottoni navigazione */
        .nav-btn { backdrop-filter: blur(10px); }
        .nav-btn.active { 
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); 
            color: white; 
            border-color: #f87171; 
            box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.5); 
            transform: scale(1.05);
        }
        
        /* Stile carte effetto vetro (Glassmorphism) */
        .glass-card {
            background: var(--fantaCard);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--fantaBorder);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Input stilizzati */
        .fanta-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .fanta-input:focus { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 pb-24">

    <!-- HEADER -->
    <header class="text-center mb-10 mt-6 animate-[slideUp_0.5s_ease-out]">
        <h1 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-400 via-red-600 to-red-900 mb-2 tracking-tighter uppercase drop-shadow-lg">
            Fantagenvers
        </h1>
        <p class="text-red-200/60 text-lg md:text-xl font-medium tracking-wide">L'Asta è finita. Inizia la gloria.</p>
    </header>

    <!-- MENU DI NAVIGAZIONE -->
    <nav class="flex flex-wrap justify-center gap-3 mb-12 max-w-5xl mx-auto">
        <button onclick="showTab('classifica', this)" class="nav-btn active px-6 py-3 rounded-2xl font-bold transition-all bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700/50 text-slate-300">🏆 Classifica</button>
        <button onclick="showTab('squadre', this)" class="nav-btn px-6 py-3 rounded-2xl font-bold transition-all bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700/50 text-slate-300">🛡️ Rose</button>
        <button onclick="showTab('regolamento', this)" class="nav-btn px-6 py-3 rounded-2xl font-bold transition-all bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700/50 text-slate-300">📜 Regole</button>
        <button onclick="showTab('inserisci-squadra', this)" class="nav-btn px-6 py-3 rounded-2xl font-bold transition-all bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700/50 text-slate-300">➕ Aggiungi</button>
        <button onclick="showTab('assegna-bonus', this)" class="nav-btn px-6 py-3 rounded-2xl font-bold transition-all bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700/50 text-slate-300">⚡ Bonus/Malus</button>
    </nav>

    <!-- DATALIST per suggerimenti liberi (Creazione Rosa) -->
    <datalist id="lista-squadre"></datalist>

    <!-- TAB 1: CLASSIFICA -->
    <main id="classifica" class="tab-content active max-w-3xl mx-auto">
        <div class="glass-card rounded-3xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-red-900/40 text-red-400 text-sm uppercase tracking-wider">
                        <th class="p-5 font-bold text-center w-20">Pos</th>
                        <th class="p-5 font-bold">Squadra</th>
                        <th class="p-5 font-bold text-right">Punti</th>
                    </tr>
                </thead>
                <tbody id="classifica-body">
                    <tr><td colspan="3" class="p-10 text-center text-slate-500 font-medium animate-pulse">Caricamento classifica in corso...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- TAB 2: LE SQUADRE -->
    <main id="squadre" class="tab-content max-w-4xl mx-auto">
        <div class="glass-card p-6 md:p-8 rounded-3xl mb-8 flex flex-col md:flex-row items-center gap-4 justify-between">
            <label for="team-select" class="text-slate-300 font-semibold text-lg whitespace-nowrap">Seleziona Rosa:</label>
            <select id="team-select" onchange="renderTeam(this.value)" class="w-full fanta-input text-white rounded-xl p-4 outline-none text-lg font-medium cursor-pointer">
                <option value="">-- Scegli una squadra --</option>
            </select>
        </div>
        <div id="team-roster" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-center col-span-2 text-slate-500 py-10">Nessuna squadra selezionata.</div>
        </div>
    </main>

    <!-- TAB 3: REGOLAMENTO -->
    <main id="regolamento" class="tab-content max-w-5xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="regolamento-body">
            <div class="p-10 text-center text-slate-500 col-span-full">Lettura delle regole in corso...</div>
        </div>
    </main>

    <!-- TAB 4: CREA ROSA -->
    <main id="inserisci-squadra" class="tab-content max-w-xl mx-auto">
        <div class="glass-card p-8 md:p-10 rounded-3xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-red-600/10 rounded-full blur-3xl"></div>
            <h2 class="text-3xl font-black mb-8 text-white flex items-center gap-3">
                <span class="text-red-500">➕</span> Aggiungi Giocatore
            </h2>
            <form onsubmit="inviaGiocatore(event)" class="flex flex-col gap-6 relative z-10">
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Nome Squadra</label>
                    <input type="text" id="nome-squadra" list="lista-squadre" placeholder="Es. I Fuoricorso" required class="w-full fanta-input text-white p-4 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Categoria</label>
                    <select id="categoria-giocatore" required class="w-full fanta-input text-white p-4 rounded-xl outline-none cursor-pointer">
                        <option value="">-- Seleziona --</option>
                        <option value="Agenvers">Agenvers</option>
                        <option value="Professori">Professori</option>
                        <option value="Lusticers">Lusticers</option>
                        <option value="Comparse">Comparse</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Nome Giocatore</label>
                    <input type="text" id="nome-giocatore" placeholder="Es. Prof. Severini" required class="w-full fanta-input text-white p-4 rounded-xl outline-none">
                </div>
                <button type="submit" id="btn-salva-giocatore" class="mt-4 bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white p-4 rounded-xl font-bold text-lg transition-all shadow-[0_0_20px_rgba(220,38,38,0.4)] hover:scale-[1.02]">
                    Salva nella Rosa
                </button>
            </form>
        </div>
    </main>

    <!-- TAB 5: ASSEGNA BONUS/MALUS -->
    <main id="assegna-bonus" class="tab-content max-w-xl mx-auto">
        <div class="glass-card p-8 md:p-10 rounded-3xl relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-yellow-500/10 rounded-full blur-3xl"></div>
            <h2 class="text-3xl font-black mb-8 text-white flex items-center gap-3">
                <span class="text-yellow-500">⚡</span> Registra Evento
            </h2>
            <form onsubmit="inviaEvento(event)" class="flex flex-col gap-6 relative z-10">
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Squadra</label>
                    <!-- TENDINA DINAMICA SQUADRA -->
                    <select id="evento-squadra" required class="w-full fanta-input text-white p-4 rounded-xl outline-none cursor-pointer">
                        <option value="">-- Caricamento squadre... --</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Giocatore coinvolto</label>
                    <input type="text" id="evento-giocatore" placeholder="Chi ha compiuto l'azione?" required class="w-full fanta-input text-white p-4 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-400 mb-2 block uppercase tracking-wider">Evento dal Regolamento</label>
                    <!-- TENDINA DINAMICA EVENTO (Con punteggio integrato) -->
                    <select id="evento-azione" required class="w-full fanta-input text-white p-4 rounded-xl outline-none cursor-pointer appearance-none bg-right pr-10">
                        <option value="" data-punti="">-- Caricamento regole... --</option>
                    </select>
                </div>
                <button type="submit" id="btn-salva-evento" class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-800 hover:from-yellow-500 hover:to-yellow-700 text-white p-4 rounded-xl font-bold text-lg transition-all shadow-[0_0_20px_rgba(234,179,8,0.3)] hover:scale-[1.02]">
                    Registra Punteggio
                </button>
            </form>
        </div>
    </main>

    <script>
        // =========================================================
        // CONFIGURAZIONE LINK (Incolla i tuoi link qui!)
        // =========================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwQyZ4VTZOGP6f2PFW00VCKSMWwNfxc8RVNvWbRjhMh4_jwKzv8t5e7VNoqxaXKE3JC/exec"; 
        const CSV_CLASSIFICA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRl-qnKldgasEz_DfiahCZaQ3LLW_POMA-_jn_58GcIEWjDf_45bfyMrxJ3i1tRYjxnUJKIIrhCfxN/pub?gid=0&single=true&output=csv";
        const CSV_ROSE       = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRl-qnKldgasEz_DfiahCZaQ3LLW_POMA-_jn_58GcIEWjDf_45bfyMrxJ3i1tRYjxnUJKIIrhCfxN/pub?gid=740776950&single=true&output=csv";
        const CSV_REGOLAMENTO= "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRl-qnKldgasEz_DfiahCZaQ3LLW_POMA-_jn_58GcIEWjDf_45bfyMrxJ3i1tRYjxnUJKIIrhCfxN/pub?gid=652674934&single=true&output=csv";
        // =========================================================

        let globalRose = [];

        // Gestione Tab con UI aggiornata
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => { 
                el.classList.remove('active'); 
            });
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function fetchCSV(url) {
            return new Promise((resolve, reject) => {
                if(!url || url.includes("INCOLLA_QUI")) { resolve([]); return; }
                Papa.parse(url, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (results) => resolve(results.data),
                    error: (err) => reject(err)
                });
            });
        }

        // RENDER 1: Classifica
        function renderClassifica(data) {
            const tbody = document.getElementById('classifica-body');
            if(data.length === 0) return tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-500">Nessun dato o CSV non configurato.</td></tr>';
            tbody.innerHTML = '';
            
            data.sort((a, b) => (parseInt(b.Punti) || 0) - (parseInt(a.Punti) || 0)).forEach((row, i) => {
                if(!row.Squadra) return;
                let badge = i === 0 ? '<span class="text-2xl drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]">👑</span>' : (i + 1);
                let posColor = i === 0 ? 'text-yellow-400' : (i===1 ? 'text-slate-300' : (i===2 ? 'text-amber-600' : 'text-slate-500'));
                
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                        <td class="p-5 text-center font-bold text-xl ${posColor}">${badge}</td>
                        <td class="p-5 font-black text-white text-lg tracking-wide">${row.Squadra}</td>
                        <td class="p-5 text-right font-mono text-3xl font-black text-red-500 drop-shadow-md">${row.Punti || 0}</td>
                    </tr>`;
            });
        }

        // RENDER 2: Squadre (e popolamento dropdown)
        function setupSquadre(roseData) {
            globalRose = roseData;
            const squadre = [...new Set(roseData.map(r => r.Squadra).filter(Boolean))].sort();
            
            // Popola i menu di selezione (Rosa e Eventi) e i suggerimenti
            const selectVisualizza = document.getElementById('team-select');
            const selectEvento = document.getElementById('evento-squadra');
            const datalist = document.getElementById('lista-squadre');
            
            let optionsHTML = '<option value="">-- Seleziona squadra --</option>';
            let datalistHTML = '';
            
            squadre.forEach(sq => {
                optionsHTML += `<option value="${sq}">${sq}</option>`;
                datalistHTML += `<option value="${sq}">`;
            });

            selectVisualizza.innerHTML = optionsHTML;
            selectEvento.innerHTML = optionsHTML; // Menu dinamico Assegna Punti
            datalist.innerHTML = datalistHTML;
        }

        // Visualizzazione singola rosa
        function renderTeam(squadraNome) {
            const container = document.getElementById('team-roster');
            if (!squadraNome) { container.innerHTML = '<div class="text-center col-span-2 text-slate-500 py-10">Seleziona una squadra.</div>'; return; }

            const myTeam = globalRose.filter(r => r.Squadra === squadraNome);
            container.innerHTML = '';
            
            const categories = {
                "Agenvers": "border-blue-500/30 bg-blue-500/10 text-blue-300",
                "Professori": "border-purple-500/30 bg-purple-500/10 text-purple-300",
                "Lusticers": "border-orange-500/30 bg-orange-500/10 text-orange-300",
                "Comparse": "border-slate-500/30 bg-slate-500/10 text-slate-300"
            };

            myTeam.forEach(membro => {
                if(!membro.Giocatore) return;
                const catStr = (membro.Categoria || "Comparse").trim();
                const style = categories[catStr] || categories["Comparse"];
                
                container.innerHTML += `
                    <div class="p-5 rounded-2xl border ${style} flex flex-col backdrop-blur-sm hover:scale-105 transition-transform cursor-default">
                        <span class="text-[10px] font-black uppercase tracking-[0.2em] mb-1 opacity-70">${catStr}</span>
                        <span class="text-xl font-bold text-white drop-shadow-sm">${membro.Giocatore}</span>
                    </div>`;
            });
        }

        // RENDER 3: Regolamento (e popolamento dropdown Eventi)
        function renderRegolamento(data) {
            const container = document.getElementById('regolamento-body');
            const selectEvento = document.getElementById('evento-azione'); // Dropdown Eventi
            
            if(data.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-slate-500 col-span-full">Nessun dato o CSV non configurato.</div>';
                selectEvento.innerHTML = '<option value="">-- Configura CSV Regolamento --</option>';
                return;
            }
            
            container.innerHTML = '';
            let optionsHTML = '<option value="" data-punti="">-- Scegli l\'azione compiuta --</option>';

            data.forEach(row => {
                if(!row.Azione) return;
                const pt = parseInt(row.Punti) || 0;
                const isBonus = pt > 0;
                const sign = isBonus ? '+' : '';
                
                // Card Regolamento Visuale
                const color = isBonus ? 'text-green-400' : 'text-red-500';
                const bg = isBonus ? 'bg-green-500/5 border-green-500/20' : 'bg-red-500/5 border-red-500/20';
                const dest = row.Destinatario ? `<span class="bg-black/40 text-[10px] px-2 py-1 rounded-full text-slate-400 uppercase tracking-widest border border-white/5 font-bold">${row.Destinatario}</span>` : '';
                
                container.innerHTML += `
                    <div class="p-6 rounded-3xl border ${bg} flex flex-col justify-between hover:bg-white/5 transition-colors">
                        <div class="mb-4">${dest}</div>
                        <div class="text-slate-200 font-medium leading-snug text-lg mb-4">${row.Azione}</div>
                        <div class="font-black text-3xl ${color} self-end drop-shadow-md">${sign}${pt}</div>
                    </div>`;

                // Popolamento tendina (testo + punti come attributo data)
                optionsHTML += `<option value="${row.Azione}" data-punti="${pt}">${row.Azione} (${sign}${pt} pt)</option>`;
            });

            selectEvento.innerHTML = optionsHTML;
        }

        // Avvio
        async function initData() {
            try {
                const [dataClassifica, dataRose, dataRegolamento] = await Promise.all([
                    fetchCSV(CSV_CLASSIFICA), fetchCSV(CSV_ROSE), fetchCSV(CSV_REGOLAMENTO)
                ]);
                renderClassifica(dataClassifica);
                setupSquadre(dataRose);
                renderRegolamento(dataRegolamento);
            } catch(e) { console.error("Errore CSV", e); }
        }

        // Chiamate API Backend
        async function inviaGiocatore(e) {
            e.preventDefault();
            if(API_URL.includes("INCOLLA")) return alert("Manca l'URL dell'API!");
            
            const btn = document.getElementById('btn-salva-giocatore');
            btn.innerText = "Salvataggio..."; btn.disabled = true;

            const sq = encodeURIComponent(document.getElementById('nome-squadra').value);
            const cat = encodeURIComponent(document.getElementById('categoria-giocatore').value);
            const nome = encodeURIComponent(document.getElementById('nome-giocatore').value);

            await fetch(`${API_URL}?action=addPlayer&squadra=${sq}&categoria=${cat}&nome=${nome}`, { method: 'GET', mode: 'no-cors' });
            
            alert("Giocatore salvato!");
            document.getElementById('nome-giocatore').value = ''; 
            btn.innerText = "Salva nella Rosa"; btn.disabled = false;
        }

        async function inviaEvento(e) {
            e.preventDefault();
            if(API_URL.includes("INCOLLA")) return alert("Manca l'URL dell'API!");

            const btn = document.getElementById('btn-salva-evento');
            btn.innerText = "Registrazione..."; btn.disabled = true;

            // Recupera la squadra scelta dalla tendina
            const sq = encodeURIComponent(document.getElementById('evento-squadra').value);
            const gioc = encodeURIComponent(document.getElementById('evento-giocatore').value);
            
            // Recupera Azione e Punti dall'opzione selezionata nella tendina
            const selectEvento = document.getElementById('evento-azione');
            const opzioneScelta = selectEvento.options[selectEvento.selectedIndex];
            
            const az = encodeURIComponent(opzioneScelta.value); // L'azione testuale
            const pt = encodeURIComponent(opzioneScelta.getAttribute('data-punti')); // I punti nascosti
            
            if(!opzioneScelta.value) {
                alert("Devi selezionare un evento valido!");
                btn.innerText = "Registra Punteggio"; btn.disabled = false;
                return;
            }

            await fetch(`${API_URL}?action=addEvent&squadra=${sq}&giocatore=${gioc}&azione=${az}&punti=${pt}`, { method: 'GET', mode: 'no-cors' });
            
            alert("Punteggio assegnato con successo!");
            e.target.reset();
            btn.innerText = "Registra Punteggio"; btn.disabled = false;
        }

        initData();
    </script>
</body>
</html>
